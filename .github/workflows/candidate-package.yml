name: Release candidate package

on:
  pull_request:
    branches: [main]
    paths:
      - "Directory.Build.props"
      - "LICENSE"
      - "NOTICE"
      - "COMMERCIAL-LICENSE.md"
      - "COPYRIGHT.md"
      - "TRADEMARK.md"
      - "THIRD_PARTY_NOTICES.md"
      - "docs/LICENSING.md"
      - "src/**"
      - "tests/**"
      - "scripts/publish-windows-portable.ps1"
      - "scripts/publish-windows-installer.ps1"
      - "scripts/render-offline-manuals.py"
      - "docs/USER_MANUAL.md"
      - "docs/QUICK_START.md"
      - "docs/INSTALLATION_AND_UPDATE.md"
      - "docs/RELEASE_PACKAGING.md"
      - "scripts/verify-windows-installer.ps1"
      - "installer/**"
      - "scripts/verify-release-package.ps1"
      - "scripts/repository-health.ps1"
      - "docs/RELEASE_NOTES_v*.md"
      - ".github/workflows/candidate-package.yml"
      - ".github/workflows/release-package.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: candidate-package-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  candidate:
    name: Build verified Windows x64 candidate
    if: github.event_name == 'workflow_dispatch' || startsWith(github.head_ref, 'stabilization/') || startsWith(github.head_ref, 'architecture/') || startsWith(github.head_ref, 'legal/') || startsWith(github.head_ref, 'fix/') || startsWith(github.head_ref, 'feat/')
    runs-on: windows-latest
    timeout-minutes: 50

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x

      - name: Resolve repository version
        id: version
        shell: pwsh
        run: |
          [xml]$props = Get-Content .\Directory.Build.props -Raw
          $prefixNode = $props.SelectSingleNode('/Project/PropertyGroup/VersionPrefix')
          $suffixNode = $props.SelectSingleNode('/Project/PropertyGroup/VersionSuffix')
          if ($null -eq $prefixNode) { throw 'VersionPrefix is missing.' }
          $prefix = $prefixNode.InnerText.Trim()
          $suffix = if ($null -eq $suffixNode) { '' } else { $suffixNode.InnerText.Trim() }
          $version = if ([string]::IsNullOrWhiteSpace($suffix)) { $prefix } else { "$prefix-$suffix" }
          if ([string]::IsNullOrWhiteSpace($version)) { throw 'Unable to resolve repository version.' }
          "value=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Host "Candidate version: $version"

      - name: Reject already-published version
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "v${{ steps.version.outputs.value }}"
          gh release view $tag --repo "${{ github.repository }}" *> $null
          if ($LASTEXITCODE -eq 0) {
            throw "Version $tag was already published. Bump VersionPrefix; never replace historical public binaries."
          }

      - name: Repository health gate
        shell: pwsh
        run: .\scripts\repository-health.ps1 -ExpectedVersion '${{ steps.version.outputs.value }}'

      - name: Restore
        run: dotnet restore .\ProcessBusSuite.sln

      - name: Build
        run: dotnet build .\ProcessBusSuite.sln -c Release --no-restore /p:ContinuousIntegrationBuild=true

      - name: Test
        run: dotnet test .\ProcessBusSuite.sln -c Release --no-build --logger "trx;LogFileName=candidate-tests.trx" --results-directory .\TestResults

      - name: Generate current offline PDF manuals
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check reportlab==4.4.9
          if ($LASTEXITCODE -ne 0) { throw 'Pinned ReportLab PDF build dependency unavailable.' }
          python .\scripts\render-offline-manuals.py
          if ($LASTEXITCODE -ne 0) { throw 'Offline manual PDF generation failed.' }

      - name: Publish portable package
        shell: pwsh
        run: .\scripts\publish-windows-portable.ps1 -Version '${{ steps.version.outputs.value }}' -Configuration Release -Runtime win-x64

      - name: Verify portable package
        shell: pwsh
        run: |
          $zip = ".\artifacts\release\ProcessBusInsight-v${{ steps.version.outputs.value }}-win-x64-portable.zip"
          .\scripts\verify-release-package.ps1 -PackageZip $zip

      - name: Install Inno Setup 6
        shell: pwsh
        run: |
          choco install innosetup --yes --no-progress
          if ($LASTEXITCODE -ne 0) { throw 'Inno Setup compiler installation failed.' }

      - name: Compile Inno installer
        shell: pwsh
        run: .\scripts\publish-windows-installer.ps1 -Version '${{ steps.version.outputs.value }}'

      - name: Smoke test Inno installation and repair
        shell: pwsh
        run: |
          $version = '${{ steps.version.outputs.value }}'
          $installer = ".\artifacts\release\ProcessBusInsight-v$version-win-x64-setup.exe"
          $stage = ".\artifacts\package\ProcessBusInsight-v$version-win-x64-portable"
          .\scripts\verify-windows-installer.ps1 -Installer $installer -StageDir $stage

      - name: Create candidate manifest
        shell: pwsh
        run: |
          $manifest = [ordered]@{
            product = 'Process Bus Insight'
            version = '${{ steps.version.outputs.value }}'
            candidate = $true
            commit = '${{ github.event.pull_request.head.sha || github.sha }}'
            sourceRef = '${{ github.head_ref || github.ref_name }}'
            runtime = 'win-x64'
            framework = 'net8.0-windows'
            primaryDistribution = 'inno-setup-exe'
            offlineManuals = @('User Manual.pdf', 'Quick Start.pdf')
            upgradeMode = 'stable-inno-appid-in-place-repair'
            installerSigned = $false
            communityLicense = 'GPL-3.0-or-later'
            historicalBoundary = '85d43a0fe58a5888a9e8008c168ab76d2333ea87'
            timestampUtc = (Get-Date).ToUniversalTime().ToString('o')
          }
          $manifest | ConvertTo-Json | Set-Content .\artifacts\release\candidate-manifest.json -Encoding utf8

      - name: Upload verified candidate
        uses: actions/upload-artifact@v7
        with:
          name: ProcessBusInsight-v${{ steps.version.outputs.value }}-win-x64-inno-candidate-${{ github.run_number }}
          path: |
            artifacts/release/ProcessBusInsight-v${{ steps.version.outputs.value }}-win-x64-setup.exe
            artifacts/release/SHA256SUMS.txt
            artifacts/release/candidate-manifest.json
            TestResults/**
          if-no-files-found: error
          retention-days: 14
