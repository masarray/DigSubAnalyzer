name: Release Windows installer and portable package

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version label, for example 1.4.0
        required: true
        default: 1.4.0
      publish_release:
        description: Publish GitHub Release after successful validation (manual only)
        required: true
        default: false
        type: boolean
      field_acceptance_verified:
        description: "I confirm documented real-NIC capture, injector agreement, and soak acceptance on the target Windows configuration"
        required: true
        default: false
        type: boolean
      prerelease:
        description: Mark GitHub Release as prerelease
        required: true
        default: true
        type: boolean
      draft:
        description: Create a draft release
        required: true
        default: false
        type: boolean
      release_notes_file:
        description: Markdown file used as release body
        required: true
        default: docs/RELEASE_NOTES_v1.4.0.md
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  package:
    name: Validate and package Windows x64
    runs-on: windows-latest
    timeout-minutes: 55

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x

      - name: Resolve release version
        id: version
        shell: pwsh
        run: |
          $version = '${{ github.event.inputs.version }}'
          if ([string]::IsNullOrWhiteSpace($version)) { $version = '${{ github.ref_name }}' }
          $version = $version.Trim()
          if ($version.StartsWith('v')) { $version = $version.Substring(1) }
          if ([string]::IsNullOrWhiteSpace($version)) { throw 'Unable to resolve release version.' }
          "value=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Host "Release version: $version"

      # Tags can build reproducible packages, but never auto-publish an
      # unreviewed stable release simply because a tag was pushed.
      - name: Public release authorization gate
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_release }}
        shell: pwsh
        env:
          FIELD_ACCEPTANCE: ${{ inputs.field_acceptance_verified }}
          RUN_REF: ${{ github.ref }}
        run: |
          if ($env:RUN_REF -ne 'refs/heads/main') {
            throw 'Public releases must be built from the validated main branch.'
          }
          if ($env:FIELD_ACCEPTANCE -ne 'true') {
            throw 'Public release blocked: field acceptance has not been explicitly verified.'
          }

      - name: Repository health gate
        shell: pwsh
        run: .\scripts\repository-health.ps1 -ExpectedVersion '${{ steps.version.outputs.value }}'

      - name: Restore
        run: dotnet restore .\ProcessBusSuite.sln

      - name: Build
        run: dotnet build .\ProcessBusSuite.sln -c Release --no-restore /p:ContinuousIntegrationBuild=true

      - name: Test
        run: dotnet test .\ProcessBusSuite.sln -c Release --no-build --logger "trx;LogFileName=release-tests.trx" --results-directory .\TestResults

      - name: Publish portable package
        shell: pwsh
        run: .\scripts\publish-windows-portable.ps1 -Version '${{ steps.version.outputs.value }}' -Configuration Release -Runtime win-x64

      - name: Verify portable package
        shell: pwsh
        run: |
          $zip = ".\artifacts\release\ProcessBusInsight-v${{ steps.version.outputs.value }}-win-x64-portable.zip"
          .\scripts\verify-release-package.ps1 -PackageZip $zip

      - name: Install Inno Setup 6
        shell: pwsh
        run: |
          choco install innosetup --yes --no-progress
          if ($LASTEXITCODE -ne 0) { throw 'Inno Setup compiler installation failed.' }

      - name: Compile Inno installer
        shell: pwsh
        run: .\scripts\publish-windows-installer.ps1 -Version '${{ steps.version.outputs.value }}'

      - name: Smoke test Inno installation and repair
        shell: pwsh
        run: |
          $version = '${{ steps.version.outputs.value }}'
          $installer = ".\artifacts\release\ProcessBusInsight-v$version-win-x64-setup.exe"
          $stage = ".\artifacts\package\ProcessBusInsight-v$version-win-x64-portable"
          .\scripts\verify-windows-installer.ps1 -Installer $installer -StageDir $stage

      - name: Create release manifest
        shell: pwsh
        run: |
          $manifest = [ordered]@{
            product = 'Process Bus Insight'
            version = '${{ steps.version.outputs.value }}'
            commit = '${{ github.sha }}'
            runtime = 'win-x64'
            framework = 'net8.0-windows'
            primaryDistribution = 'inno-setup-exe'
            secondaryDistribution = 'portable-zip'
            offlineManuals = @('User Manual.pdf', 'Quick Start.pdf')
            upgradeMode = 'stable-inno-appid-in-place-repair'
            installerSigned = $false
            communityLicense = 'GPL-3.0-or-later'
            historicalBoundary = '85d43a0fe58a5888a9e8008c168ab76d2333ea87'
            timestampUtc = (Get-Date).ToUniversalTime().ToString('o')
          }
          $manifest | ConvertTo-Json | Set-Content .\artifacts\release\release-manifest.json -Encoding utf8

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: ProcessBusInsight-v${{ steps.version.outputs.value }}-win-x64-installer-and-portable
          path: |
            artifacts/release/ProcessBusInsight-v${{ steps.version.outputs.value }}-win-x64-setup.exe
            artifacts/release/ProcessBusInsight-v${{ steps.version.outputs.value }}-win-x64-portable.zip
            artifacts/release/SHA256SUMS.txt
            artifacts/release/release-manifest.json
            TestResults/**
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_release }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = '${{ steps.version.outputs.value }}'
          $tag = "v$version"
          $zip = "artifacts/release/ProcessBusInsight-v$version-win-x64-portable.zip"
          $installer = "artifacts/release/ProcessBusInsight-v$version-win-x64-setup.exe"
          $sha = "artifacts/release/SHA256SUMS.txt"
          $manifest = "artifacts/release/release-manifest.json"
          $notesFile = '${{ github.event.inputs.release_notes_file }}'
          if ([string]::IsNullOrWhiteSpace($notesFile)) { $notesFile = 'docs/RELEASE_NOTES_v1.4.0.md' }
          if (-not (Test-Path $notesFile)) { throw "Release notes file not found: $notesFile" }

          $releaseArgs = @('release', 'create', $tag, $installer, $zip, $sha, $manifest, '--title', "Process Bus Insight $tag", '--notes-file', $notesFile, '--target', '${{ github.sha }}')
          $isDraft = '${{ github.event.inputs.draft }}'
          $isPrerelease = '${{ github.event.inputs.prerelease }}'
          # A pre-release version must always remain a prerelease.
          if ($version -match '-') { $isPrerelease = 'true' }
          if ($isDraft -eq 'true') { $releaseArgs += '--draft' }
          if ($isPrerelease -eq 'true') { $releaseArgs += '--prerelease' }

          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag $installer $zip $sha $manifest --clobber
          } else {
            gh @releaseArgs
          }
